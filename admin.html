	<script>
		// Utility functions
		function formatTimestamp(timestamp) {
			const date = new Date(timestamp);
			return date.toLocaleString('en-US', {
				year: 'numeric',
				month: 'short',
				day: 'numeric',
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit',
				hour12: true
			});
		}

		// Mapping function for user-friendly names
		function mapToFriendlyName(technicalName, type) {
			const mappings = {
				// Views
				'welcome': 'Welcome Screen',
				'pathSelect': 'Choose your path',
				'technicalDashboard': 'Technical Dashboard',
				'businessDashboard': 'Business Dashboard',
				'walkthrough': 'Platform Walkthrough',
				'demosTech': 'Demo Library (Technical Path)',
				'demosBusiness': 'Demo Library (Business Path)',
				'caseStudiesBusiness': 'Case Studies (Business Path)',
				'caseStudiesTechnical': 'Case Studies (Technical Path)',
				'businessQuiz': 'Business Path Quiz',
				'technicalQuiz': 'Technical Path Quiz',
				
				// Modals/Swipers
				'walkthroughOverlay': 'Platform Walkthrough Modal',
				'demosBusinessOverlay': 'Demo Library (Business Path) Modal',
				'demosTechOverlay': 'Demo Library (Technical Path) Modal',
				'brochureOverlay': 'Brochure Modal',
				'hfsOverlay': 'HFS Report Modal',
				'formOverlay': 'Contact Form',
				
				// Swiper Names
				'walkthroughSwiper': 'Platform Walkthrough Slider',
				'demoBusinessSwiper': 'Demo Library (Business Path) Slider',
				'demoTechSwiper': 'Demo Library (Technical Path) Slider',
				'brochureSwiper': 'Brochure Slider',
				'hfsSwiper': 'HFS Report Slider',
				'caseStudiesSwiper': 'Case Studies Slider',
				
				// Quiz Types
				'business': 'Business Path',
				'technical': 'Technical Path',
				
				// Case Study Types
				'Business': 'Business Path',
				'Technical': 'Technical Path'
			};
			
			return mappings[technicalName] || technicalName;
		}

		function mapArrayToFriendlyNames(array) {
			return array.map(item => mapToFriendlyName(item)).join('; ');
		}

		function formatDuration(seconds) {
			const hours = Math.floor(seconds / 3600);
			const minutes = Math.floor((seconds % 3600) / 60);
			const secs = seconds % 60;
						
			if (hours > 0) {
				return `${hours}h ${minutes}m ${secs}s`;
			} else if (minutes > 0) {
				return `${minutes}m ${secs}s`;
			} else {
				return `${secs}s`;
			}
		}

		function getAnalyticsData() {
			return JSON.parse(localStorage.getItem('kioskAnalytics') || '[]');
		}

		function getFormSubmissions() {
			return JSON.parse(localStorage.getItem('kioskSubmissions') || '[]');
		}

		function getSessionsData() {
			const analytics = getAnalyticsData();
			const sessions = {};
						
			analytics.forEach(event => {
				if (event.session_id) {
					if (!sessions[event.session_id]) {
						sessions[event.session_id] = {
							id: event.session_id,
							startTime: event.timestamp,
							endTime: event.timestamp,
							events: [],
							duration: 0
						};
					}
										
					sessions[event.session_id].events.push(event);
					sessions[event.session_id].endTime = event.timestamp;
				}
			});
						
			// Calculate durations
			Object.values(sessions).forEach(session => {
				const start = new Date(session.startTime);
				const end = new Date(session.endTime);
				session.duration = Math.floor((end - start) / 1000);
			});
						
			return Object.values(sessions).sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
		}

		function calculateMetrics() {
			const sessions = getSessionsData();
			const submissions = getFormSubmissions();
			const analytics = getAnalyticsData();
						
			const totalSessions = sessions.length;
			const totalUsers = new Set(sessions.map(s => s.id)).size;
			const avgSessionTime = totalSessions > 0 ? 
				Math.floor(sessions.reduce((sum, s) => sum + s.duration, 0) / totalSessions) : 0;
			const totalFormSubmissions = submissions.length;
						
			// Count slide interactions
			const totalSlideInteractions = analytics.filter(event => 
				event.type === 'swiper_slide_changed' || event.type === 'swiper_slide_goto' || event.type === 'case_study_slide_changed'
			).length;
						
			document.getElementById('totalUsers').textContent = totalUsers;
			document.getElementById('avgSessionTime').textContent = formatDuration(avgSessionTime);
			document.getElementById('totalFormSubmissions').textContent = totalFormSubmissions;
			document.getElementById('totalSlideInteractions').textContent = totalSlideInteractions;
		}

		function createViewsChart() {
			const analytics = getAnalyticsData();
			const chartContainer = document.getElementById('viewsChart');
			chartContainer.innerHTML = '';
			
			// Define all possible views (excluding welcome screen)
			const allViews = [
				'pathSelect', 
				'technicalDashboard',
				'businessDashboard',
				'walkthrough',
				'demosTech',
				'demosBusiness',
				'caseStudiesBusiness',
				'caseStudiesTechnical',
				'businessQuiz',
				'technicalQuiz'
			];
			
			// Count unique view visits per session (first visit only)
			const viewCounts = {};
			const sessionViewVisits = {};
			
			// Initialize all views with zero counts
			allViews.forEach(view => {
				viewCounts[view] = 0;
			});
			
			// Group events by session
			analytics.forEach(event => {
				if (event.session_id) {
					if (!sessionViewVisits[event.session_id]) {
						sessionViewVisits[event.session_id] = new Set();
					}
					
					// Only count the first visit to each view per session
					if (event.type === 'view_change' && event.to && !sessionViewVisits[event.session_id].has(event.to)) {
						sessionViewVisits[event.session_id].add(event.to);
						if (viewCounts.hasOwnProperty(event.to)) {
							viewCounts[event.to]++;
						}
					}
				}
			});
						
			const maxViews = Math.max(...Object.values(viewCounts));
			const views = Object.entries(viewCounts).sort((a, b) => b[1] - a[1]);
						
			views.forEach(([view, count]) => {
				const width = maxViews > 0 ? (count / maxViews) * 100 : 0;
				
				const barContainer = document.createElement('div');
				barContainer.className = 'horizontal-bar-container';
				
				const label = document.createElement('div');
				label.className = 'bar-label';
				label.textContent = mapToFriendlyName(view);
				
				const barWrapper = document.createElement('div');
				barWrapper.className = 'bar-wrapper';
				
				const bar = document.createElement('div');
				bar.className = 'horizontal-bar';
				bar.style.width = `${width}%`;
				
				const value = document.createElement('div');
				value.className = 'bar-value';
				value.textContent = count;
				
				barWrapper.appendChild(bar);
				barWrapper.appendChild(value);
				barContainer.appendChild(label);
				barContainer.appendChild(barWrapper);
				chartContainer.appendChild(barContainer);
			});
		}

		function createSwiperChart() {
			const analytics = getAnalyticsData();
			const chartContainer = document.getElementById('swiperChart');
			chartContainer.innerHTML = '';
			
			// Define all possible swipers
			const allSwipers = [
				'walkthroughSwiper',
				'demoBusinessSwiper',
				'demoTechSwiper',
				'brochureSwiper',
				'hfsSwiper',
				'caseStudiesSwiper'
			];
						
			// Count swiper interactions
			const swiperCounts = {};
			
			// Initialize all swipers with zero counts
			allSwipers.forEach(swiper => {
				swiperCounts[swiper] = 0;
			});
			
			analytics.forEach(event => {
				if ((event.type === 'swiper_slide_changed' || event.type === 'swiper_slide_goto' || event.type === 'case_study_slide_changed') && event.swiper_name) {
					if (swiperCounts.hasOwnProperty(event.swiper_name)) {
						swiperCounts[event.swiper_name]++;
					}
				}
			});
						
			const maxInteractions = Math.max(...Object.values(swiperCounts));
			const swipers = Object.entries(swiperCounts).sort((a, b) => b[1] - a[1]);
						
			swipers.forEach(([swiperName, count]) => {
				const width = maxInteractions > 0 ? (count / maxInteractions) * 100 : 0;
				
				const barContainer = document.createElement('div');
				barContainer.className = 'horizontal-bar-container';
				
				const label = document.createElement('div');
				label.className = 'bar-label';
				label.textContent = mapToFriendlyName(swiperName);
				
				const barWrapper = document.createElement('div');
				barWrapper.className = 'bar-wrapper';
				
				const bar = document.createElement('div');
				bar.className = 'horizontal-bar';
				bar.style.width = `${width}%`;
				
				const value = document.createElement('div');
				value.className = 'bar-value';
				value.textContent = count;
				
				barWrapper.appendChild(bar);
				barWrapper.appendChild(value);
				barContainer.appendChild(label);
				barContainer.appendChild(barWrapper);
				chartContainer.appendChild(barContainer);
			});
		}

		function populateSessionsTable() {
			const sessions = getSessionsData();
			const tableContainer = document.getElementById('sessionsTable');
						
			if (sessions.length === 0) {
				tableContainer.innerHTML = '<div class="no-data">No session data available</div>';
				return;
			}
						
			const recentSessions = sessions.slice(0, 10);
						
			recentSessions.forEach(session => {
				const sessionDiv = document.createElement('div');
				sessionDiv.className = 'session-item';
								
				const eventCount = session.events.length;
				const viewChanges = session.events.filter(e => e.type === 'view_change').length;
				const quizCompletions = session.events.filter(e => e.type === 'quiz_completed').length;
								
				sessionDiv.innerHTML = `
					<div class="session-header">
						<span class="session-id">${session.id}</span>
						<span class="session-duration">${formatDuration(session.duration)}</span>
					</div>
					<div class="session-events">
						Started: ${formatTimestamp(session.startTime)}<br>
						Events: ${eventCount} | Views: ${viewChanges} | Quizzes: ${quizCompletions}
					</div>
				`;
								
				tableContainer.appendChild(sessionDiv);
			});
		}

		function populateSubmissionsTable() {
			const submissions = getFormSubmissions();
			const tableContainer = document.getElementById('submissionsTable');
						
			if (submissions.length === 0) {
				tableContainer.innerHTML = '<div class="no-data">No form submissions available</div>';
				return;
			}
						
			const recentSubmissions = submissions.slice(-10).reverse();
						
			recentSubmissions.forEach(submission => {
				const row = document.createElement('div');
				row.className = 'table-row';
								
				row.innerHTML = `
					<div>${submission['First Name']} ${submission['Last Name']}</div>
					<div>${submission['Company']}</div>
					<div>${submission['Work Email']}</div>
					<div>${submission['Country']}</div>
				`;
								
				tableContainer.appendChild(row);
			});
		}

		function exportToCSV(data, filename) {
			if (data.length === 0) {
				alert('No data to export');
				return;
			}
						
			const headers = Object.keys(data[0]);
			const csvContent = [
				headers.join(','),
				...data.map(row => 
					headers.map(header => {
						const value = row[header];
						return typeof value === 'string' && value.includes(',') ? 
							`"${value}"` : value;
					}).join(',')
				)
			].join('\n');
						
			const blob = new Blob([csvContent], { type: 'text/csv' });
			const url = window.URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = filename;
			a.click();
			window.URL.revokeObjectURL(url);
		}

		function exportSessions() {
			const sessions = getSessionsData();
			const analytics = getAnalyticsData();
			
			// Create session summary data
			const sessionData = sessions.map(session => {
				const sessionEvents = analytics.filter(event => event.session_id === session.id);
				
				// Count different event types
				const eventCounts = {};
				const views = new Set();
				const modals = new Set();
				const quizzes = new Set();
				const caseStudies = new Set();
				let totalSlideInteractions = 0;
				let quizScore = null;
				
				sessionEvents.forEach(event => {
					// Count event types
					eventCounts[event.type] = (eventCounts[event.type] || 0) + 1;
					
					// Track views (unique views visited)
					if (event.view) views.add(event.view);
					
					// Track modals
					if (event.modal_name) modals.add(event.modal_name);
					
					// Track quizzes
					if (event.quiz_type) quizzes.add(event.quiz_type);
					
					// Track case studies
					if (event.type === 'case_study_slide_changed' && event.case_study_title) {
						caseStudies.add(event.case_study_title);
					}
					
					// Count slide interactions
					if (event.type === 'swiper_slide_changed' || event.type === 'swiper_slide_goto' || event.type === 'case_study_slide_changed') {
						totalSlideInteractions++;
					}
					
					// Get quiz score
					if (event.type === 'quiz_completed' && event.score !== undefined) {
						quizScore = event.score;
					}
				});
				
				return {
					'Session ID': session.id,
					'Start Time': formatTimestamp(session.startTime),
					'End Time': formatTimestamp(session.endTime),
					'Duration': formatDuration(session.duration),
					'Total Events': sessionEvents.length,
					'Unique Views Visited': mapArrayToFriendlyNames(Array.from(views)),
					'Total View Changes': eventCounts['view_change'] || 0,
					'Case Studies Viewed': Array.from(caseStudies).join('; '),
					'Modal Opens': eventCounts['modal_opened'] || 0,
					'Modals Opened': mapArrayToFriendlyNames(Array.from(modals)),
					'Slide Interactions': totalSlideInteractions,
					'Quizzes Taken': mapArrayToFriendlyNames(Array.from(quizzes)),
					'Highest Quiz Score': quizScore || 'N/A',
					'Form Submissions': eventCounts['form_submitted'] || 0,
				};
			});
			
			exportToCSV(sessionData, `kiosk-sessions-${new Date().toISOString().split('T')[0]}.csv`);
		}

		function exportFormSubmissions() {
			const submissions = getFormSubmissions();
			const formattedData = submissions.map(submission => ({
				'First Name': submission['First Name'],
				'Last Name': submission['Last Name'],
				'Company': submission['Company'],
				'Work Email': submission['Work Email'],
				'Country': submission['Country'],
				'Submitted At': formatTimestamp(submission.timestamp)
			}));
						
			exportToCSV(formattedData, `kiosk-submissions-${new Date().toISOString().split('T')[0]}.csv`);
		}

		function exportAllData() {
			const allData = {
				analytics: getAnalyticsData(),
				submissions: getFormSubmissions(),
				sessions: getSessionsData(),
				exportDate: new Date().toISOString()
			};
						
			const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
			const url = window.URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = `kiosk-all-data-${new Date().toISOString().split('T')[0]}.json`;
			a.click();
			window.URL.revokeObjectURL(url);
		}

		function refreshDashboard() {
			calculateMetrics();
			createViewsChart();
			createSwiperChart();
			populateSessionsTable();
			populateSubmissionsTable();
		}

		function clearAllData() {
			if (confirm('Are you sure you want to clear all analytics and form submission data? This action cannot be undone.')) {
				localStorage.removeItem('kioskAnalytics');
				localStorage.removeItem('kioskSubmissions');
				refreshDashboard();
				alert('All data has been cleared.');
			}
		}

		// Initialize dashboard on load
		document.addEventListener('DOMContentLoaded', function() {
			refreshDashboard();
		});
		
	</script>
</body>
</html>
